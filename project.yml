name: StreetPassMusic
options:
  bundleIdPrefix: com.keranatsuki
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StreetPassMusic:
    type: application
    platform: iOS
    # Team ID は git 管理外の Local.xcconfig から読む（Local.xcconfig.example をコピーして作る）
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    sources:
      - path: StreetPassMusic
    info:
      path: StreetPassMusic/Info.plist
      properties:
        CFBundleDisplayName: StreetPass Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        NSBluetoothAlwaysUsageDescription: 近くのアプリ利用者と曲を交換するためにBluetoothを利用します。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keranatsuki.streetpassmusic
        TARGETED_DEVICE_FAMILY: "1"
